# AndroidSignTool 自动构建 + 发布 + 更新签名
# 触发：推送 v* 标签（或手动触发）→ 构建 NSIS 安装包 → minisign 签名 → 发布 Release + latest.json
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY         = ~/.tauri/android-sign-tool-updater.key 全文内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 对应私钥口令
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # apksigner.jar / zipalign.exe 的来源（prepare-tools.ps1 读 ANDROID_HOME）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools 35.0.0
        run: sdkmanager --install "build-tools;35.0.0"

      # jlink 裁剪内置 JRE 的来源（prepare-tools.ps1 读 JAVA_HOME）
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: npm ci

      - name: Prepare bundled toolchain (apksigner / zipalign / jlink JRE)
        shell: pwsh
        run: npm run prepare:tools

      - name: Build + sign + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseBody: 'Android APK 签名工具 Windows 版'
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          args: ''
